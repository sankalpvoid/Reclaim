name: Foundation checks

on:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.css'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/lifecycle-syntax.yml'
  push:
    branches:
      - main
      - fix/data-foundation
      - feat/welcome-back-flow
      - feat/manual-mood-checkin
      - fix/cloud-hydration
      - fix/startup-state-ownership
      - fix/behavior-event-model
      - chore/foundation-final-cleanup
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.css'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/lifecycle-syntax.yml'

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check foundation JavaScript syntax
        run: |
          node --check app.js
          node --check startup-state-guard.js
          node --check smoking-journey.js
          node --check smoking-journey-ui.js
          node --check reduction-cloud.js
          node --check auth-lifecycle.js
          node --check welcome-back.js
          node --check checkin-sync.js
          node --check manual-checkin.js
          node --check cloud-bootstrap.js
          node --check behavior-model.js
          node --check behavior-events.js
          node --check quick-theme-toggle.js
          node --check accessibility-runtime.js
          node --check tests/foundation-regression.mjs
          node --check tests/reduction-cloud.test.mjs
          node --check tests/theme-regression.mjs
          node --check tests/smoking-journey.e2e.mjs
          node --check tests/reduction-cloud.e2e.mjs
          node --check tests/responsive.e2e.mjs
          node --check tests/startup-refresh.e2e.mjs
      - name: Run foundation regression tests
        run: node --test tests/foundation-regression.mjs tests/smoking-journey.test.mjs tests/reduction-cloud.test.mjs tests/theme-regression.mjs

  browser-e2e:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for CI only
        run: |
          mkdir -p /tmp/reclaim-playwright
          cd /tmp/reclaim-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.63.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Start Reclaim locally
        run: |
          python3 -m http.server 4173 >/tmp/reclaim-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/reclaim-http.log
          exit 1
      - name: Run browser suites
        env:
          PLAYWRIGHT_PATH: /tmp/reclaim-playwright/node_modules/playwright
        run: |
          CHROME_PATH="$(node -e "const { chromium } = require('/tmp/reclaim-playwright/node_modules/playwright'); process.stdout.write(chromium.executablePath())")"
          export CHROME_PATH
          node tests/smoking-journey.e2e.mjs
          node tests/reduction-cloud.e2e.mjs
          node tests/responsive.e2e.mjs
          node tests/startup-refresh.e2e.mjs
