name: Lifecycle syntax

on:
  pull_request:
    paths:
      - 'auth-lifecycle.js'
      - 'welcome-back.js'
      - 'checkin-sync.js'
      - 'session-bootstrap.js'
      - 'manual-checkin.js'
      - 'cloud-bootstrap.js'
      - 'behavior-model.js'
      - 'behavior-events.js'
      - 'index.html'
  push:
    branches:
      - fix/data-foundation
      - feat/welcome-back-flow
      - feat/manual-mood-checkin
      - fix/cloud-hydration
      - fix/startup-state-ownership
      - fix/behavior-event-model
    paths:
      - 'auth-lifecycle.js'
      - 'welcome-back.js'
      - 'checkin-sync.js'
      - 'session-bootstrap.js'
      - 'manual-checkin.js'
      - 'cloud-bootstrap.js'
      - 'behavior-model.js'
      - 'behavior-events.js'
      - 'index.html'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check lifecycle JavaScript syntax
        run: |
          node --check auth-lifecycle.js
          node --check welcome-back.js
          node --check checkin-sync.js
          node --check session-bootstrap.js
          node --check manual-checkin.js
          node --check cloud-bootstrap.js
          node --check behavior-model.js
          node --check behavior-events.js
