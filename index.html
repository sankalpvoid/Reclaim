<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <script>
      (() => {
        const saved = localStorage.getItem('reclaim-theme-v1');
        const theme = saved === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f8f6fc' : '#000000';
      })();
    </script>
    <style>
      html,body{margin:0;min-height:100%;background:#050505;color:#fff}
      html[data-theme="light"],html[data-theme="light"] body{background:#f8f6fc;color:#18151d}
      #app{min-height:100dvh}
      .boot-shell{box-sizing:border-box;width:min(100%,430px);min-height:100dvh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 22px 92px;background:#000;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
      .boot-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:12px;margin-bottom:42px}
      .boot-brand{text-align:center;font:700 22px/1 Arial,sans-serif;letter-spacing:.04em}
      .boot-icon{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.025)}
      .boot-hero{margin-bottom:20px}
      .boot-eyebrow,.boot-line,.boot-card,.boot-pill{position:relative;overflow:hidden;background:rgba(255,255,255,.075)}
      .boot-eyebrow{width:96px;height:10px;border-radius:8px;margin-bottom:14px}
      .boot-line{height:40px;border-radius:11px;margin-bottom:9px}
      .boot-line.short{width:72%}
      .boot-subline{width:58%;height:12px;border-radius:8px;margin-top:15px;background:rgba(255,255,255,.055)}
      .boot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
      .boot-card{height:108px;border-radius:18px;border:1px solid rgba(255,255,255,.06)}
      .boot-card.wide{grid-column:1/-1;height:144px}
      .boot-pill{width:46%;height:44px;border-radius:14px;margin-top:14px}
      .boot-eyebrow::after,.boot-line::after,.boot-card::after,.boot-pill::after{content:"";position:absolute;inset:0;transform:translateX(-110%);background:linear-gradient(90deg,transparent,rgba(139,92,246,.16),transparent);animation:reclaimBootShimmer 1.25s ease-in-out infinite}
      @keyframes reclaimBootShimmer{100%{transform:translateX(110%)}}
      html[data-theme="light"] .boot-shell{background:#f8f6fc}
      html[data-theme="light"] .boot-icon{border-color:rgba(35,25,48,.10);background:rgba(35,25,48,.025)}
      html[data-theme="light"] .boot-eyebrow,html[data-theme="light"] .boot-line,html[data-theme="light"] .boot-card,html[data-theme="light"] .boot-pill,html[data-theme="light"] .boot-subline{background:rgba(47,36,62,.075)}
      html[data-theme="light"] .boot-card{border-color:rgba(47,36,62,.06)}
      @media(min-width:700px){body{padding:20px}.boot-shell{min-height:calc(100dvh - 40px);border:1px solid #242424;border-radius:28px}html[data-theme="light"] .boot-shell{border-color:rgba(47,36,62,.12)}}
      @media(max-width:480px){.boot-shell{padding:calc(env(safe-area-inset-top) + 22px) 22px calc(92px + env(safe-area-inset-bottom))}.boot-top{margin-bottom:36px}}
      @media(prefers-reduced-motion:reduce){.boot-eyebrow::after,.boot-line::after,.boot-card::after,.boot-pill::after{animation:none}}
    </style>
    <meta name="description" content="Reclaim — a calm, evidence-informed smoke-free companion." />
    <title>Reclaim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=recovery-1" />
    <link rel="stylesheet" href="elapsed.css?v=recovery-1" />
    <link rel="stylesheet" href="personalized-insights.css?v=recovery-1" />
    <link rel="stylesheet" href="name-personalization.css?v=recovery-1" />
    <link rel="stylesheet" href="value-refinements.css?v=ux-1" />
    <link rel="stylesheet" href="light-theme.css?v=light-1" />
    <link rel="stylesheet" href="light-theme-polish.css?v=light-polish-2" />
    <link rel="stylesheet" href="community-light-fix.css?v=community-light-2" />
    <link rel="stylesheet" href="welcome-back.css?v=welcome-back-3" />
    <link rel="stylesheet" href="manual-checkin.css?v=manual-checkin-1" />
  </head>
  <body>
    <div id="app" aria-live="polite">
      <div class="boot-shell" aria-label="Loading Reclaim">
        <div class="boot-top">
          <div class="boot-icon"></div>
          <div class="boot-brand">RECLAIM</div>
          <div class="boot-icon"></div>
        </div>
        <div class="boot-hero">
          <div class="boot-eyebrow"></div>
          <div class="boot-line"></div>
          <div class="boot-line short"></div>
          <div class="boot-subline"></div>
        </div>
        <div class="boot-grid">
          <div class="boot-card"></div>
          <div class="boot-card"></div>
          <div class="boot-card wide"></div>
        </div>
        <div class="boot-pill"></div>
      </div>
    </div>
    <script type="module" src="auth-lifecycle.js?v=auth-lifecycle-2"></script>
    <script type="module" src="cloud-bootstrap.js?v=cloud-bootstrap-1"></script>
    <script type="module" src="app.js?v=light-1"></script>
    <script type="module" src="welcome-back.js?v=welcome-back-3"></script>
    <script type="module" src="session-bootstrap.js?v=session-bootstrap-2"></script>
    <script type="module" src="checkin-sync.js?v=session-lifecycle-4"></script>
    <script type="module" src="manual-checkin.js?v=manual-checkin-1"></script>
    <script src="personalized-insights.js?v=recovery-1" defer></script>
    <script type="module" src="name-personalization.js?v=recovery-1"></script>
    <script src="quick-theme-toggle.js?v=theme-toggle-1" defer></script>
    <script type="module" src="analytics.js?v=analytics-1"></script>
  </body>
</html>
