<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <script>
      (() => {
        const saved = localStorage.getItem('reclaim-theme-v1');
        const theme = saved === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f8f6fc' : '#000000';
      })();
    </script>
    <style>
      html,body{margin:0;min-height:100%;background:#050505;color:#fff}
      html[data-theme="light"],html[data-theme="light"] body{background:#f8f6fc;color:#18151d}
      #app{min-height:100dvh}
      .boot-shell{box-sizing:border-box;width:min(100%,430px);min-height:100dvh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 22px 96px;background:#000;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;position:relative}
      .boot-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:12px;margin-bottom:28px}
      .boot-brand{text-align:center;font:700 22px/1 Arial,sans-serif;letter-spacing:.04em}
      .boot-icon{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.025)}
      .boot-block,.boot-card,.boot-pill,.boot-circle,.boot-row,.boot-tab,.boot-bar{position:relative;overflow:hidden;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.05)}
      .boot-block::after,.boot-card::after,.boot-pill::after,.boot-circle::after,.boot-row::after,.boot-tab::after,.boot-bar::after{content:"";position:absolute;inset:0;transform:translateX(-110%);background:linear-gradient(90deg,transparent,rgba(139,92,246,.18),transparent);animation:reclaimBootShimmer 1.25s ease-in-out infinite}
      @keyframes reclaimBootShimmer{100%{transform:translateX(110%)}}
      .boot-kicker{width:92px;height:9px;border-radius:7px;margin:0 0 14px}
      .boot-title{height:42px;border-radius:10px;margin:0 0 9px}
      .boot-title.short{width:68%}.boot-copy{height:12px;border-radius:7px;margin-top:14px;width:78%}.boot-copy.short{width:54%}
      .boot-card{border-radius:18px}.boot-card.hero{height:230px}.boot-card.large{height:164px}.boot-card.medium{height:118px}.boot-card.small{height:82px}
      .boot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.boot-stack{display:grid;gap:11px}.boot-section{margin-top:20px}.boot-section.tight{margin-top:12px}
      .boot-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 18px}.boot-tabs.three{grid-template-columns:repeat(3,1fr)}.boot-tab{height:34px;border-radius:10px}
      .boot-row{height:72px;border-radius:16px}.boot-row.tall{height:92px}.boot-row.compact{height:58px}.boot-row.slim{height:44px}
      .boot-pill{height:38px;border-radius:999px}.boot-pill.sm{height:30px}.boot-pill.w45{width:45%}.boot-pill.w65{width:65%}.boot-pill.w80{width:80%}
      .boot-circle{width:96px;height:96px;border-radius:50%;margin:18px auto}.boot-circle.lg{width:190px;height:190px}.boot-circle.sm{width:48px;height:48px;margin:0}
      .boot-bar{height:9px;border-radius:999px;margin-top:14px}.boot-spacer{height:16px}
      .boot-nav{position:absolute;left:0;right:0;bottom:0;height:76px;border-top:1px solid rgba(255,255,255,.07);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 13px calc(env(safe-area-inset-bottom));background:rgba(8,8,8,.96)}
      .boot-nav span{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.075);justify-self:center}
      .boot-form{display:grid;gap:12px;margin-top:22px}.boot-field{height:52px;border-radius:13px}.boot-choice{height:86px;border-radius:18px}.boot-centered{padding-top:9vh;text-align:center}.boot-centered .boot-title{margin-left:auto;margin-right:auto}.boot-centered .boot-copy{margin-left:auto;margin-right:auto}
      .boot-auth-logo{width:82px;height:82px;border-radius:50%;margin:0 auto 28px}.boot-intro-art{height:310px;border-radius:30px;margin:18px 0 28px}.boot-timeline{display:grid;gap:12px;margin-top:22px}.boot-timeline .boot-row{height:84px}
      .boot-stage-pills{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.boot-stage-pills .boot-pill{width:100%;height:38px}
      html[data-theme="light"] .boot-shell{background:#f8f6fc}
      html[data-theme="light"] .boot-icon{border-color:rgba(35,25,48,.10);background:rgba(35,25,48,.025)}
      html[data-theme="light"] .boot-block,html[data-theme="light"] .boot-card,html[data-theme="light"] .boot-pill,html[data-theme="light"] .boot-circle,html[data-theme="light"] .boot-row,html[data-theme="light"] .boot-tab,html[data-theme="light"] .boot-bar{background:rgba(47,36,62,.075);border-color:rgba(47,36,62,.06)}
      html[data-theme="light"] .boot-nav{background:rgba(248,246,252,.97);border-top-color:rgba(47,36,62,.08)}
      @media(min-width:700px){body{padding:20px}.boot-shell{min-height:calc(100dvh - 40px);border:1px solid #242424;border-radius:28px}html[data-theme="light"] .boot-shell{border-color:rgba(47,36,62,.12)}}
      @media(max-width:480px){.boot-shell{padding:calc(env(safe-area-inset-top) + 22px) 22px calc(96px + env(safe-area-inset-bottom))}}
      @media(prefers-reduced-motion:reduce){.boot-block::after,.boot-card::after,.boot-pill::after,.boot-circle::after,.boot-row::after,.boot-tab::after,.boot-bar::after{animation:none}}
    </style>
    <meta name="description" content="Reclaim — a calm, evidence-informed smoke-free companion." />
    <title>Reclaim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=recovery-1" />
    <link rel="stylesheet" href="elapsed.css?v=recovery-1" />
    <link rel="stylesheet" href="personalized-insights.css?v=recovery-1" />
    <link rel="stylesheet" href="name-personalization.css?v=recovery-1" />
    <link rel="stylesheet" href="value-refinements.css?v=ux-1" />
    <link rel="stylesheet" href="light-theme.css?v=light-1" />
    <link rel="stylesheet" href="light-theme-polish.css?v=light-polish-2" />
    <link rel="stylesheet" href="community-light-fix.css?v=community-light-2" />
    <link rel="stylesheet" href="welcome-back.css?v=welcome-back-3" />
    <link rel="stylesheet" href="manual-checkin.css?v=manual-checkin-1" />
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <script>
      (()=>{
        const el=document.getElementById('app');
        const block=(cls='')=>`<div class="boot-block ${cls}"></div>`;
        const card=(cls='medium')=>`<div class="boot-card ${cls}"></div>`;
        const row=(cls='')=>`<div class="boot-row ${cls}"></div>`;
        const pill=(cls='')=>`<div class="boot-pill ${cls}"></div>`;
        const top=(label='RECLAIM')=>`<div class="boot-top"><div class="boot-icon"></div><div class="boot-brand">${label}</div><div class="boot-icon"></div></div>`;
        const heading=()=>`${block('boot-kicker')}${block('boot-title')}${block('boot-title short')}${block('boot-copy short')}`;
        const nav=()=>`<div class="boot-nav"><span></span><span></span><span></span><span></span><span></span></div>`;
        const shell=(body,{navBar=false}={})=>`<div class="boot-shell" aria-label="Loading Reclaim">${body}${navBar?nav():''}</div>`;
        let state={stage:'intro',view:'home'};
        try{state={...state,...JSON.parse(localStorage.getItem('reclaim-state-v2')||'{}')}}catch{}
        const stage=state.stage||'intro',view=state.view||'home';
        const appPage=()=>{
          if(view==='home')return shell(`${top('RECLAIM')}<div class="boot-stack">${card('hero')}<div class="boot-grid">${card('medium')}${card('medium')}</div>${row('compact')}${card('large')}${row('compact')}</div>`,{navBar:true});
          if(view==='health')return shell(`${top('HEALTH')}<div>${heading()}</div><div class="boot-circle lg"></div><div class="boot-timeline">${row()}${row()}${row()}${row()}</div>`,{navBar:true});
          if(view==='momentum')return shell(`${top('MOMENTUM')}<div class="boot-tabs"><div class="boot-tab"></div><div class="boot-tab"></div></div>${heading()}<div class="boot-stack boot-section">${card('large')}<div class="boot-grid">${card('medium')}${card('medium')}</div>${row('compact')}${card('medium')}</div>`,{navBar:true});
          if(view==='dreams')return shell(`${top('DREAMS')}<div>${heading()}</div><div class="boot-stack boot-section">${card('large')}${card('large')}${row('compact')}</div>`,{navBar:true});
          if(view==='insights')return shell(`${top('INSIGHTS')}<div class="boot-tabs three"><div class="boot-tab"></div><div class="boot-tab"></div><div class="boot-tab"></div></div><div class="boot-stack">${card('large')}${card('large')}${card('medium')}</div>`,{navBar:true});
          if(view==='craving')return shell(`${top('CRAVING SUPPORT')}<div>${heading()}</div><div class="boot-stack boot-section">${row('tall')}${row('tall')}${row('tall')}${row('tall')}${row('compact')}</div>`,{navBar:true});
          if(view==='circles')return shell(`${top('RECLAIM CIRCLES')}<div>${heading()}</div><div class="boot-tabs"><div class="boot-tab"></div><div class="boot-tab"></div></div><div class="boot-stage-pills">${pill()}${pill()}${pill()}${pill()}</div><div class="boot-stack">${row('compact')}${card('medium')}${card('large')}${card('large')}</div>`,{navBar:true});
          if(view==='more')return shell(`${top('MORE')}<div>${heading()}</div><div class="boot-stack boot-section">${row('tall')}${row()}${row()}${row()}${row()}${row('compact')}</div>`,{navBar:true});
          return shell(`${top('RECLAIM')}<div>${heading()}</div><div class="boot-stack boot-section">${card('hero')}${card('medium')}${card('medium')}</div>`,{navBar:true});
        };
        let html;
        if(stage==='app')html=appPage();
        else if(stage==='mood')html=shell(`<div class="boot-centered">${block('boot-kicker')}${block('boot-title short')}${block('boot-copy short')}<div class="boot-stack boot-section">${row('tall')}${row('tall')}${row('tall')}${row('tall')}</div></div>`);
        else if(stage==='support')html=shell(`${top('RECLAIM')}<div>${heading()}</div><div class="boot-stack boot-section">${card('medium')}${row('tall')}${row('tall')}${row('tall')}${row('compact')}</div>`);
        else if(stage==='setup')html=shell(`${top('SET UP')}<div>${heading()}</div><div class="boot-form">${row('compact')}${row('compact')}${row('compact')}${row('compact')}${row('compact')}${row('compact')}${pill('w80')}</div>`);
        else if(stage==='path')html=shell(`${top('RECLAIM')}<div>${heading()}</div><div class="boot-stack boot-section">${row('tall')}${row('tall')}${row('tall')}</div>`);
        else if(stage==='auth')html=shell(`<div class="boot-centered"><div class="boot-circle boot-auth-logo"></div>${block('boot-title short')}${block('boot-copy short')}<div class="boot-form">${row('compact')}${row('compact')}${row('compact')}${pill('w80')}</div></div>`);
        else html=shell(`<div class="boot-centered"><div class="boot-intro-art boot-card"></div>${block('boot-kicker')}${block('boot-title')}${block('boot-title short')}${block('boot-copy')}${pill('w80')}</div>`);
        el.innerHTML=html;
      })();
    </script>
    <script type="module" src="auth-lifecycle.js?v=auth-lifecycle-2"></script>
    <script type="module" src="cloud-bootstrap.js?v=cloud-bootstrap-1"></script>
    <script type="module" src="app.js?v=light-1"></script>
    <script type="module" src="welcome-back.js?v=welcome-back-3"></script>
    <script type="module" src="session-bootstrap.js?v=session-bootstrap-2"></script>
    <script type="module" src="checkin-sync.js?v=session-lifecycle-4"></script>
    <script type="module" src="manual-checkin.js?v=manual-checkin-1"></script>
    <script src="personalized-insights.js?v=recovery-1" defer></script>
    <script type="module" src="name-personalization.js?v=recovery-1"></script>
    <script src="quick-theme-toggle.js?v=theme-toggle-1" defer></script>
    <script type="module" src="analytics.js?v=analytics-1"></script>
  </body>
</html>
